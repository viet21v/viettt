<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ảnh Bạn Bè</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            color: #333333;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            text-align: center;
            color: #666666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .heart {
            text-align: center;
            margin-top: 15px;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="temp_image_E7D6C630-EB66-436F-BBC1-5A1EFB61446F.jpg" alt="Ảnh bạn bè">
        <h1>✨ Những Người Bạn ✨</h1>
        <p>Đây là những người bạn tuyệt vời của mình</p>
        <p>Cùng học tập, cùng vui chơi, cùng trưởng thành</p>
        <p>Mãi là bạn tốt của nhau ❤️</p>
        <div class="heart">🤝💖</div>
    </div>
</body>
</html>
